<script>
(() => {
  const PHOTO = "avatar.jpg";
  const KW = new Set("import from export const class enum type interface readonly implements return async await function new as satisfies default extends private public static void null true false typeof keyof of in let while if never boolean string number".split(" "));
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  const hrefFor = v => {
    if (/^https?:\/\//.test(v)) return v;
    if (/^(github\.com|t\.me|linkedin\.com)\//.test(v)) return "https://" + v;
    return null;
  };

  const comment = seg => {
    let h = esc(seg)
      .replace(/(https?:\/\/[^\s*]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|\s)(@\w+)/g, '$1<span class="dt">$2</span>')
      .replace(/(TODO\([^)]*\):?)/g, '<span class="todo">$1</span>');
    return '<span class="c">' + h + "</span>";
  };

  const peek = (line, i) => { while (i < line.length && line[i] === " ") i++; return line.slice(i, i + 2); };

  function highlight(line, st) {
    let out = "", i = 0, prev = "";
    while (i < line.length) {
      if (st.block) {
        const end = line.indexOf("*/", i);
        const seg = end < 0 ? line.slice(i) : line.slice(i, end + 2);
        out += comment(seg); i += seg.length;
        if (end >= 0) st.block = false;
        continue;
      }
      const rest = line.slice(i), ch = line[i];
      if (rest.startsWith("//")) { out += comment(rest); break; }
      if (rest.startsWith("/*")) {
        const end = line.indexOf("*/", i + 2);
        const seg = end < 0 ? rest : line.slice(i, end + 2);
        out += comment(seg); i += seg.length;
        if (end < 0) st.block = true;
        continue;
      }
      if (ch === "'" || ch === '"' || ch === "`") {
        let j = i + 1;
        while (j < line.length && line[j] !== ch) j++;
        const inner = line.slice(i + 1, j);
        const href = hrefFor(inner);
        const body = href ? '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(inner) + "</a>" : esc(inner);
        out += '<span class="s">' + ch + body + ch + "</span>";
        i = j + 1; prev = "s"; continue;
      }
      if (ch === "@" && /[A-Z]/.test(line[i + 1] || "")) {
        const m = rest.match(/^@\w+/)[0];
        out += '<span class="d">' + m + "</span>"; i += m.length; continue;
      }
      if (ch === "<" && /^<\/?[a-z]/.test(rest)) {
        const m = rest.match(/^<\/?[a-z]+>?/)[0];
        out += '<span class="tg">' + esc(m) + "</span>"; i += m.length; continue;
      }
      if (/\d/.test(ch)) {
        const m = rest.match(/^\d+/)[0];
        out += '<span class="n">' + m + "</span>"; i += m.length; continue;
      }
      if (/[A-Za-z_$]/.test(ch)) {
        const m = rest.match(/^[\w$]+/)[0];
        const after = peek(line, i + m.length);
        let cls;
        if (KW.has(m)) cls = "k";
        else if (prev === ".") cls = /^[A-Z]/.test(m) && after[0] !== "(" ? "m" : "f";
        else if (after[0] === "(") cls = "f";
        else if (/^[A-Z]/.test(m)) cls = (prev === "class" || prev === "enum" || prev === "interface" || prev === "type") ? "t big" : "t";
        else if (after[0] === ":" || (after[0] === "=" && after[1] !== ">" && after[1] !== "=")) cls = "p";
        else if (after[0] === "," || after[0] === "?") cls = "p";
        else cls = "";
        out += cls ? '<span class="' + cls + '">' + m + "</span>" : m;
        i += m.length; prev = KW.has(m) ? m : "id"; continue;
      }
      if (ch === " ") { out += " "; i++; continue; }
      out += '<span class="o">' + esc(ch) + "</span>";
      prev = ch; i++;
    }
    return out;
  }

  function render(name) {
    const host = document.querySelector('[data-src="' + name + '"]');
    const src = document.getElementById("src-" + name).textContent.replace(/^\n/, "").replace(/\s+$/, "");
    const st = { block: false };
    const html = [];
    for (const line of src.split("\n")) {
      if (line.trim() === "%%PHOTO%%") {
        html.push('<div class="photo"><img src="' + PHOTO + '" alt="Daniil Liagin" width="369" height="500"></div>');
        continue;
      }
      const indent = line.match(/^ */)[0].length;
      html.push('<div class="l" style="--i:' + indent + '">' + highlight(line.slice(indent), st) + "</div>");
    }
    host.innerHTML = html.join("");
  }

  render("left");
  render("right");

  const last = document.querySelector('[data-src="right"] .l:last-child');
  if (last) last.insertAdjacentHTML("beforeend", '<span class="cursor" aria-hidden="true"></span>');

  const todos = [...document.querySelectorAll(".todo")].map(t => t.closest(".l"));
  document.getElementById("todo-count").textContent = todos.length;
  document.getElementById("todo-btn").hidden = todos.length === 0;
  let k = 0;
  document.getElementById("todo-btn").addEventListener("click", () => {
    if (!todos.length) return;
    const el = todos[k++ % todos.length];
    el.scrollIntoView({ block: "center", behavior: "smooth" });
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  });

  const pos = document.getElementById("pos");
  document.querySelectorAll(".code").forEach(code => {
    code.addEventListener("mouseover", e => {
      const l = e.target.closest(".l");
      if (!l) return;
      const n = [...code.querySelectorAll(".l")].indexOf(l) + 1;
      pos.textContent = "Ln " + n + ", Col " + ((parseInt(l.style.getPropertyValue("--i")) || 0) + 1);
    });
  });
})();
</script>
